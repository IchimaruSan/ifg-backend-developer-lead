quarkus.application.name=ifg-kafka-transaction-processor

# PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=ifg
quarkus.datasource.password=ifg_local_password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/ifg_transactions
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# Kafka incoming topic
kafka.bootstrap.servers=localhost:19092
mp.messaging.incoming.transactions-in.connector=smallrye-kafka
mp.messaging.incoming.transactions-in.topic=transactions-in
mp.messaging.incoming.transactions-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.transactions-in.auto.offset.reset=earliest
mp.messaging.incoming.transactions-in.group.id=ifg-transaction-processor
mp.messaging.incoming.transactions-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.transactions-in.dead-letter-queue.topic=transactions-in-dlq

# HTTP
quarkus.http.port=8080
